packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

overrides:
  "@aws-sdk/checksums": "3.1000.11"
  "@aws-sdk/client-s3": "3.1078.0"
  "@aws-sdk/core": "3.974.26"
  "@aws-sdk/credential-provider-env": "3.972.52"
  "@aws-sdk/credential-provider-http": "3.972.54"
  "@aws-sdk/credential-provider-ini": "3.972.59"
  "@aws-sdk/credential-provider-login": "3.972.58"
  "@aws-sdk/credential-provider-node": "3.972.61"
  "@aws-sdk/credential-provider-process": "3.972.52"
  "@aws-sdk/credential-provider-sso": "3.972.58"
  "@aws-sdk/credential-provider-web-identity": "3.972.58"
  "@aws-sdk/middleware-sdk-s3": "3.972.57"
  "@aws-sdk/nested-clients": "3.997.26"
  "@aws-sdk/token-providers": "3.1078.0"
  "@expo/cli": "57.0.3"
  "@expo/config": "57.0.1"
  "@expo/config-plugins": "57.0.1"
  "@expo/env": "2.4.0"
  "@expo/fingerprint": "0.20.1"
  "@expo/image-utils": "0.11.0"
  "postcss": "8.5.24"
  "js-yaml": "4.3.2"
  "nanoid": "3.3.18"
  # brace-expansion OOM (CVE-2025-5889 / GHSA-mh99-v99m-4gvg): pin each major to
  # its API-compatible patched release. v5 changed the export to a named
  # { expand } object, so it CANNOT be forced onto minimatch@3/9 (which call the
  # module as a function) — those stay on the patched 1.x/2.x lines.
  # 2026: к OOM добавились ещё три — рекурсия на вложенных группах
  # (GHSA-qhr7-859c-m2p7), рекурсия в parseCommaParts (GHSA-6j4f-fj2g-mc7p) и
  # квадратичное раскрытие `{a},b}` (GHSA-q2hr-2g5m-vwhr). Все три чинятся
  # в каждой линии своим патчем, поэтому поднялись все три пина сразу.
  "brace-expansion@^1.0.0": "1.1.21"
  "brace-expansion@^2.0.0": "2.1.7"
  "brace-expansion@^5.0.0": "5.0.12"
  "sharp": "0.35.5"
  # deepmerge-ts stack exhaustion (GHSA-ggr8-5vv4-36mx): @prisma/config@6.19.3
  # requires 7.1.5, патч вышел в 8.0.0. Prisma CLI (migrate deploy на деплое)
  # грузит config через этот пакет, поэтому поднимаем всю линию до патча.
  "deepmerge-ts": "8.0.1"
  "exceljs>uuid": "11.1.1"
  "xcode>uuid": "11.1.1"
  # browserslist: unbounded cache growth (GHSA-c83g-rgw3-j3cx) и запись в
  # прототип из browserslist-stats.json (GHSA-73wf-gq98-2v4g). Оба исправлены
  # в 4.28.7; линия 4.28 патчевая, @babel/helper-compilation-targets просит
  # ^4.24.0, так что пин совместим со всем деревом (веб и mobile).
  "browserslist": "4.28.9"
  # @xmldom/xmldom: XML fragment injection через EntityReference.nodeName
  # (GHSA-6gmq-8vp8-gcm6). В дереве две линии, у каждой свой патч, поэтому
  # пиним помажорно: @expo/plist просит ^0.8.8 -> 0.8.15, plist ^0.9.10 ->
  # 0.9.12. Одним общим пином не обойтись — 0.9.x не подходит под ^0.8.8.
  "@xmldom/xmldom@^0.8.0": "0.8.15"
  "@xmldom/xmldom@^0.9.0": "0.9.12"
  # compression DoS через Brotli-параметры (GHSA-g5hv-9j5v-99cw): в дереве она
  # одна, 1.8.1 -> 1.8.2, линия патчевая.
  "compression": "1.8.2"
  # node-forge: восемь advisories, семь закрыты 1.4.1 (восьмой — обход проверки
  # RSA PKCS#1 v1.5 — апстримом не исправлен нигде). Пакет тянет @expo/cli на
  # сборке, в бандл не попадает.
  "node-forge": "1.4.1"
  # shell-quote (GHSA-pqg4-j6r4-53mv): 1.9.0 у react-devtools-core, патч 1.11.0,
  # мажор тот же.
  "shell-quote": "1.11.0"
  # source-map-js ReDoS (GHSA-f9xv-q969-pqx4): 1.2.1 -> 1.2.2.
  "source-map-js": "1.2.2"
  # glob AbortSignal bypass (GHSA-3g3m-2fjr-6pw4): уязвима линия 9..14.0.1, у нас
  # это 13.0.6 внутри @expo/cli. Пин помажорный: glob@7 (archiver, readdir-glob)
  # под диапазон не попадает и остаётся на своей линии — поднимать его до 14
  # нельзя, 14 требует minimatch@11, а glob@7 написан под minimatch@3.
  "glob@>=9": "14.0.2"

# decode-uri-component DoS (GHSA-vcc3-ghjq-m6fr / CVE-2026-45822): вход с
# битым percent-кодированием уводит fallback-декодер 0.2.2 в квадратичный
# перебор — 1.2 КБ строки считаются 3.3 с, 60 КБ уже не считаются никогда.
# Путь достижим из внешнего мира: expo-router (getStateFromPath ->
# queryString.parse) прогоняет через него query каждой входящей deep link,
# так что подсунутая пользователю ссылка вешает JS-поток приложения.
# Обновлением это не чинится: патч вышел только в 0.5.0, который ESM-only и
# без замены `+` на пробел, а query-string@7.1.3 (его требует expo-router во
# ВСЕХ опубликованных 57.x) грузит модуль через require() и ждёт функцию.
# Поэтому переносим алгоритм из 0.5.0 в CJS-файл 0.2.2 патчем. Проверено:
# на 60k входов (валидных, битых, случайных) вывод совпадает и со старым
# 0.2.2, и с апстримным 0.5.0 — меняется только сложность, не поведение.
# Снять патч, когда expo-router перейдёт на query-string, не тянущий
# уязвимую линию. Если 0.2.2 уйдёт из дерева, install упадёт с
# ERR_PNPM_UNUSED_PATCH (проверено), а если пропадёт сам файл патча — с
# ENOENT на этапе хеширования. Оба падения — сигнал перепроверить, где
# теперь живёт уязвимость, а не повод молча удалить строку.
patchedDependencies:
  "decode-uri-component@0.2.2": "patches/decode-uri-component@0.2.2.patch"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - esbuild
  - prisma
  - sharp

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true
  sharp: true

auditConfig:
  ignoreGhsas:
    # brace-expansion OOM. minimatch@3/9 resolve to the patched 1.1.16 / 2.1.3
    # (the advisory's real per-major fixes are 1.1.12 / 2.0.2). pnpm collapses
    # every patched line into a single unsatisfiable ">=5.0.8" and then flags
    # those already-patched versions. See the brace-expansion override note.
    - "GHSA-mh99-v99m-4gvg"
    # Expo Metro's build-time asset inspector currently resolves image-size
    # 1.2.1. The 2026 ICNS/JXL/HEIF parser advisories publish no patched
    # version. LeadShelf does not pass uploaded/user media through Metro at
    # runtime; CI and developers invoke it only for trusted repository assets.
    # Remove these exceptions as soon as Expo/Metro publishes a fixed release.
    - "GHSA-w3rx-r6r6-pgpr"
    - "GHSA-5p2g-fcmc-qvqq"
    # decode-uri-component DoS. Апстримный фикс мы УЖЕ ставим — см.
    # patchedDependencies выше; `pnpm audit` сверяет версию из лок-файла, а
    # не код, который реально уезжает в бандл, и поэтому продолжает видеть
    # 0.2.2. Это исключение действует ровно до тех пор, пока действует патч:
    # снимаются они вместе.
    - "GHSA-vcc3-ghjq-m6fr"
    # Второй advisory той же библиотеки: квадратичное раскрытие процентных
    # последовательностей. Наш патч выше переписал decode() в один линейный
    # проход слева направо — именно эту дыру он и закрывает, апстрим пришёл к
    # тому же в 0.5.1. Снимается вместе с патчем, как и соседнее исключение.
    - "GHSA-qr28-fpjm-wq7f"
    # minimatch globparts amplification. Апстрим починил только линию 11.x и
    # не бэкпортировал: 3.1.5, 5.1.9 и 10.2.5 остаются «уязвимыми» навсегда, а
    # поднять их все разом нельзя — glob@7 требует minimatch@3. Все три живут в
    # инструментарии (@expo/cli при сборке, archiver внутри exceljs при записи
    # xlsx), и ни одному из них шаблон не приходит снаружи: usage-паттерны
    # зашиты в самих библиотеках. Пересмотреть, когда появится бэкпорт.
    - "GHSA-g3hv-75wg-m249"
    # zod memory exhaustion. Наш собственный код уже на 4.6.7 — остаётся
    # zod@3 внутри @expo/cli, и бэкпорта в линию 3.x апстрим не сделал
    # (пропатчено только с 4.6.6). Поднять его overrides нельзя: @expo/cli
    # написан под API третьей версии. Эта копия работает на сборке приложения
    # и проверяет app.json из репозитория, в бандл не попадает и строк
    # снаружи не видит. Снять, когда Expo перейдёт на zod 4.
    - "GHSA-mrhx-c7xc-m3w5"
