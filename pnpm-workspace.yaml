packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

overrides:
  "@aws-sdk/checksums": "3.1000.11"
  "@aws-sdk/client-s3": "3.1078.0"
  "@aws-sdk/core": "3.974.26"
  "@aws-sdk/credential-provider-env": "3.972.52"
  "@aws-sdk/credential-provider-http": "3.972.54"
  "@aws-sdk/credential-provider-ini": "3.972.59"
  "@aws-sdk/credential-provider-login": "3.972.58"
  "@aws-sdk/credential-provider-node": "3.972.61"
  "@aws-sdk/credential-provider-process": "3.972.52"
  "@aws-sdk/credential-provider-sso": "3.972.58"
  "@aws-sdk/credential-provider-web-identity": "3.972.58"
  "@aws-sdk/middleware-sdk-s3": "3.972.57"
  "@aws-sdk/nested-clients": "3.997.26"
  "@aws-sdk/token-providers": "3.1078.0"
  "@expo/cli": "57.0.3"
  "@expo/config": "57.0.1"
  "@expo/config-plugins": "57.0.1"
  "@expo/env": "2.4.0"
  "@expo/fingerprint": "0.20.1"
  "@expo/image-utils": "0.11.0"
  "postcss": "8.5.24"
  "brace-expansion@^1.0.0": "1.1.16"
  "brace-expansion@^2.0.0": "2.1.3"
  "brace-expansion@^5.0.0": "5.0.8"
  "sharp": "0.35.3"
  "exceljs>uuid": "11.1.1"
  "xcode>uuid": "11.1.1"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - esbuild
  - prisma
  - sharp

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true
  sharp: true

auditConfig:
  ignoreGhsas:
    # brace-expansion OOM (CVE-2025-5889). Every resolved version in this tree
    # is already patched via the overrides above — 1.1.16 (>=1.1.12),
    # 2.1.3 (>=2.0.2/2.1.2) and 5.0.8 (>=5.0.8). pnpm audit collapses this
    # advisory's several per-major patched ranges into a single unsatisfiable
    # "<=5.0.7 / >=5.0.8", which then falsely matches the patched 2.1.3 that
    # transitive minimatch@9 pulls. Suppress the false positive, not the fix.
    - "GHSA-mh99-v99m-4gvg"
