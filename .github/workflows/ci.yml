name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadshelf
          POSTGRES_PASSWORD: leadshelf
          POSTGRES_DB: leadshelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadshelf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leadshelf:leadshelf@localhost:5432/leadshelf?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @leadshelf/db validate

      - name: Apply migrations (incl. raw-SQL invariants)
        run: pnpm --filter @leadshelf/db exec prisma migrate deploy

      - name: Lint (architecture fences)
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests (incl. tenant isolation)
        run: pnpm -r test

      - name: Build web
        run: pnpm --filter @leadshelf/web build
        env:
          JWT_SECRET: ci-only-not-a-secret
