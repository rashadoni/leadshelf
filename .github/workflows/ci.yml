name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadshelf
          POSTGRES_PASSWORD: leadshelf
          POSTGRES_DB: leadshelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadshelf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leadshelf:leadshelf@localhost:5432/leadshelf?schema=public
      # CI-only policy exercises lockout readiness; production values require owner approval.
      AUTH_LOCKOUT_MAX_FAILURES: "5"
      AUTH_LOCKOUT_WINDOW_SECONDS: "900"
      AUTH_LOCKOUT_DURATION_SECONDS: "1800"
      AUTH_LOCKOUT_PEPPER: "ci-only-lockout-pepper-not-a-secret"
      LEADSHELF_RUNTIME_PROFILE: "client"
      LEADSHELF_PROOF_PRIVACY_MODE: "no_people_in_frame_attestation"
      LEADSHELF_PROOF_PRIVACY_APPROVAL: "ci-only-proof-privacy-policy"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit (moderate+)
        run: pnpm audit --prod --audit-level moderate

      - name: Prisma validate
        run: pnpm --filter @leadshelf/db validate

      - name: Prisma generate (types for tenant client)
        run: pnpm --filter @leadshelf/db generate

      - name: Apply migrations (incl. raw-SQL invariants)
        run: pnpm --filter @leadshelf/db exec prisma migrate deploy

      - name: Lint (architecture fences)
        run: pnpm lint

      - name: Validate Prometheus alert rules and firing fixtures
        run: pnpm alerts:check

      - name: Validate exact-snapshot backup and isolated restore contract
        run: pnpm backup-recovery:test

      - name: Validate fail-closed production release evidence gate
        run: pnpm release-preflight:test

      - name: Validate production env contract
        run: pnpm production-env:test

      - name: Validate credential-safe post-deploy smoke
        run: pnpm post-deploy-smoke:test

      - name: Validate help-video release package contract
        run: pnpm help-video-assets:test

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests (incl. tenant isolation)
        run: pnpm -r test
      - name: Validate load-test syntax
        run: |
          node --check deploy/load/k6-read-sync.js
          node --check deploy/load/k6-mobile-replay.js


      - name: Build web
        run: pnpm --filter @leadshelf/web build
        env:
          JWT_SECRET: ci-only-not-a-secret

      - name: Seed demo and verify readiness
        run: pnpm --filter @leadshelf/db seed:demo

      - name: Frozen mobile protocol compatibility
        run: pnpm --filter @leadshelf/web test:protocol

      - name: Install Playwright browsers
        run: pnpm --filter @leadshelf/web exec playwright install --with-deps chromium firefox webkit

      - name: Cross-browser responsive and accessibility smoke
        run: pnpm --filter @leadshelf/web test:e2e:responsive
        env:
          CI: true
          JWT_SECRET: ci-only-not-a-secret

      - name: Upload responsive regression artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-responsive-regression
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  security:
    name: Secret and production-image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan repository history for verified and unknown secrets
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          base: ""
          head: ${{ github.sha }}
          version: 3.95.3
          extra_args: --results=verified,unknown

      - name: Build all production runtime images
        run: |
          docker build --target runner --file deploy/Dockerfile.web --tag leadshelf-web:security-scan .
          docker build --target worker --file deploy/Dockerfile.web --tag leadshelf-worker:security-scan .
          docker build --file deploy/Dockerfile.caddy --tag leadshelf-caddy:security-scan .
          docker build --file deploy/Dockerfile.postgres --tag leadshelf-postgres:security-scan .

      - name: Block high and critical web-image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: leadshelf-web:security-scan
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Block high and critical worker-image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: leadshelf-worker:security-scan
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Block high and critical Caddy-image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: leadshelf-caddy:security-scan
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Block high and critical PostgreSQL-image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: leadshelf-postgres:security-scan
          fail-build: true
          severity-cutoff: high
          output-format: table

  deploy:
    needs: [ci, security]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Validate protected release configuration
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] || { echo "DEPLOY_SSH_KEY is required" >&2; exit 2; }
          [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]] || { echo "DEPLOY_HOST is invalid" >&2; exit 2; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "DEPLOY_USER is invalid" >&2; exit 2; }
          [ "$DEPLOY_USER" != "root" ] || { echo "root SSH deploy is forbidden" >&2; exit 2; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "DEPLOY_KNOWN_HOSTS is required" >&2; exit 2; }
          [[ "$PRODUCTION_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]] || { echo "PRODUCTION_URL must be an HTTPS origin" >&2; exit 2; }

      - name: Exact-SHA backup-gated production deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key "$DEPLOY_USER@$HOST" \
            sudo -n /usr/local/sbin/leadshelf-deploy-approved-release "$RELEASE_SHA"

      - name: Read-only readiness smoke
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          sleep 8
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/ready"
