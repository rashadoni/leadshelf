name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadshelf
          POSTGRES_PASSWORD: leadshelf
          POSTGRES_DB: leadshelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadshelf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leadshelf:leadshelf@localhost:5432/leadshelf?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @leadshelf/db validate

      - name: Prisma generate (types for tenant client)
        run: pnpm --filter @leadshelf/db generate

      - name: Apply migrations (incl. raw-SQL invariants)
        run: pnpm --filter @leadshelf/db exec prisma migrate deploy

      - name: Lint (architecture fences)
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests (incl. tenant isolation)
        run: pnpm -r test

      - name: Build web
        run: pnpm --filter @leadshelf/web build
        env:
          JWT_SECRET: ci-only-not-a-secret

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    steps:
      - name: Deploy to leadshelf-1
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "root@$HOST" '
            set -e
            cd /opt/leadshelf/prod/app && git pull --ff-only
            cp deploy/docker-compose.prod.yml ../docker-compose.yml
            cp deploy/Caddyfile ../Caddyfile
            cd /opt/leadshelf/prod
            docker compose build web migrate
            docker compose run --rm migrate
            docker compose up -d web caddy
            docker image prune -f > /dev/null
          '
      - name: Smoke check
        run: |
          sleep 8
          curl -sf --max-time 20 https://157-90-227-191.sslip.io/api/health
