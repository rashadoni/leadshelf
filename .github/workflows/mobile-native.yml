name: Mobile native compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mobile-native.yml"
      - "apps/mobile/**"
      - "packages/api-contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          CI: "true"
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3200
        run: pnpm exec expo prebuild --platform android --no-install --pnpm

      - name: Compile emulator APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3200
        run: ./gradlew app:assembleDebug --no-daemon -PreactNativeArchitectures=x86_64

      - name: Record compile evidence
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" > mobile-native-SHA256SUMS
          printf 'commit=%s\nkind=debug-emulator-evidence\nproduction_signed=false\n' "$GITHUB_SHA" > mobile-native-evidence.txt

      - name: Upload emulator APK evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-debug-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile-native-SHA256SUMS
            mobile-native-evidence.txt
          retention-days: 14
          if-no-files-found: error
