name: Mobile native compile

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Android ABI for the debug APK"
        required: true
        type: choice
        options: [arm64-v8a, x86_64]
        default: arm64-v8a
      backend:
        description: "Backend embedded into the debug APK"
        required: true
        type: choice
        options: [live-demo, local-emulator]
        default: live-demo
  pull_request:
    paths:
      - ".github/workflows/mobile-native.yml"
      - "apps/mobile/**"
      - "packages/api-contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEADSHELF_ANDROID_ARCH: ${{ inputs.architecture || 'arm64-v8a' }}
      LEADSHELF_API_PROFILE: ${{ inputs.backend || 'live-demo' }}
      EXPO_PUBLIC_API_URL: ${{ inputs.backend == 'local-emulator' && 'http://10.0.2.2:3200' || 'https://hermescrm.xyz' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          CI: "true"
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Compile selectable emulator APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleDebug --no-daemon -PreactNativeArchitectures="$LEADSHELF_ANDROID_ARCH"

      - name: Record compile evidence
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" > mobile-native-SHA256SUMS
          printf 'commit=%s\nkind=debug-emulator-evidence\narchitecture=%s\napi_profile=%s\nproduction_signed=false\n' \
            "$GITHUB_SHA" "$LEADSHELF_ANDROID_ARCH" "$LEADSHELF_API_PROFILE" > mobile-native-evidence.txt

      - name: Upload emulator APK evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-debug-${{ inputs.architecture || 'arm64-v8a' }}-${{ inputs.backend || 'live-demo' }}-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile-native-SHA256SUMS
            mobile-native-evidence.txt
          retention-days: 14
          if-no-files-found: error
