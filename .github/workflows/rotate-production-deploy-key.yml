name: Rotate production deploy key (one-time)

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "Type ROTATE-LEADSHELF-DEPLOY-KEY"
        required: true

permissions:
  contents: read

jobs:
  rotate:
    if: inputs.acknowledgement == 'ROTATE-LEADSHELF-DEPLOY-KEY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Install the reviewed key for the configured deploy user
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          NEW_PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMee/xxzw+NMp4VUVhkSSEU7pbDq6PJbvGnI2n2SfGK leadshelf-ci-deploy-2026-08-09
          EXPECTED_FINGERPRINT: SHA256:596Pfa99iwngLnnizJzmgxr0M8GHzP1ByMiTp9VXZk0
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ]
          [ -n "$DEPLOY_KNOWN_HOSTS" ]
          [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [ "$DEPLOY_USER" != root ]

          key_check="$(mktemp)"
          trap 'rm -f "$key_check"' EXIT
          printf '%s\n' "$NEW_PUBLIC_KEY" > "$key_check"
          [ "$(ssh-keygen -lf "$key_check" | awk '{print $2}')" = "$EXPECTED_FINGERPRINT" ]

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          public_key_b64="$(printf '%s' "$NEW_PUBLIC_KEY" | base64 -w0)"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key "root@$HOST" \
            bash -s -- "$DEPLOY_USER" "$EXPECTED_FINGERPRINT" "$public_key_b64" <<'REMOTE'
          set -euo pipefail
          target_user="$1"
          expected_fingerprint="$2"
          public_key_b64="$3"

          [[ "$target_user" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [ "$target_user" != root ]
          home_dir="$(getent passwd "$target_user" | cut -d: -f6)"
          primary_group="$(id -gn "$target_user")"
          case "$home_dir" in
            /home/*) ;;
            *) echo "unsafe deploy-user home" >&2; exit 2 ;;
          esac

          candidate="$(printf '%s' "$public_key_b64" | base64 -d)"
          case "$candidate" in
            'ssh-ed25519 '*) ;;
            *) echo "unexpected public-key type" >&2; exit 2 ;;
          esac

          candidate_file="$(mktemp)"
          trap 'rm -f "$candidate_file"' EXIT
          printf '%s\n' "$candidate" > "$candidate_file"
          actual_fingerprint="$(ssh-keygen -lf "$candidate_file" | awk '{print $2}')"
          [ "$actual_fingerprint" = "$expected_fingerprint" ]

          install -d -o "$target_user" -g "$primary_group" -m 700 "$home_dir/.ssh"
          touch "$home_dir/.ssh/authorized_keys"
          chown "$target_user:$primary_group" "$home_dir/.ssh/authorized_keys"
          chmod 600 "$home_dir/.ssh/authorized_keys"
          grep -qxF "$candidate" "$home_dir/.ssh/authorized_keys" || \
            printf '%s\n' "$candidate" >> "$home_dir/.ssh/authorized_keys"
          ssh-keygen -lf "$home_dir/.ssh/authorized_keys" | grep -Fq "$expected_fingerprint"
          REMOTE
