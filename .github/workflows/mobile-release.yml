name: Mobile signed release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Signed platform artifact"
        required: true
        type: choice
        options: [android, ios]
      profile:
        description: "EAS build profile"
        required: true
        type: choice
        options: [preview, production]
      acknowledgement:
        description: "Type SIGNED-RELEASE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-signed-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: mobile-release
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate release gate
        env:
          ACK: ${{ inputs.acknowledgement }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          [ "$ACK" = SIGNED-RELEASE ] || { echo "acknowledgement must equal SIGNED-RELEASE" >&2; exit 2; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "signed releases must run from main" >&2; exit 2; }
          [ -n "$EXPO_TOKEN" ] || { echo "mobile-release EXPO_TOKEN is required" >&2; exit 2; }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "checkout is not exact origin/main" >&2; exit 2; }

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Set up EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 21.0.2
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate mobile contracts
        run: |
          pnpm --filter @leadshelf/mobile typecheck
          pnpm --filter @leadshelf/mobile test
          pnpm --filter @leadshelf/web test:protocol

      - name: Build signed artifact without changing credentials
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://hermescrm.xyz
        run: |
          eas build \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --freeze-credentials \
            --non-interactive \
            --wait \
            --json > ../../mobile-eas-build.json

      - name: Download artifact and write minimal evidence
        run: |
          set -euo pipefail
          platform="${{ inputs.platform }}"
          profile="${{ inputs.profile }}"
          url="$(jq -er '.[0].artifacts.buildUrl' mobile-eas-build.json)"
          build_id="$(jq -er '.[0].id' mobile-eas-build.json)"
          case "$platform:$profile" in
            android:preview) extension=apk ;;
            android:production) extension=aab ;;
            ios:*) extension=ipa ;;
            *) exit 2 ;;
          esac
          artifact="leadshelf-$platform-$profile-$GITHUB_SHA.$extension"
          curl --disable --fail --silent --show-error --location --max-time 600 --output "$artifact" "$url"
          test -s "$artifact"
          sha256sum "$artifact" > mobile-release-SHA256SUMS
          jq --arg commit "$GITHUB_SHA" --arg profile "$profile" \
            '[.[0] | {id, platform, status, appVersion, appBuildVersion, createdAt, completedAt}] + [{commit:$commit, profile:$profile, productionSigned:true}]' \
            mobile-eas-build.json > mobile-release-evidence.json
          printf '%s\n' "$artifact" > mobile-release-artifact-name
          printf 'build_id=%s\n' "$build_id" >> mobile-release-evidence.txt

      - name: Upload signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-signed-${{ inputs.platform }}-${{ inputs.profile }}-${{ github.sha }}
          path: |
            leadshelf-*.apk
            leadshelf-*.aab
            leadshelf-*.ipa
            mobile-release-SHA256SUMS
            mobile-release-evidence.json
            mobile-release-evidence.txt
          retention-days: 30
          if-no-files-found: error
