# Legacy/manual delivery path for an owner-approved Azerbaijani media release.
# Normal production deploys copy git-tracked video/player assets atomically
# with the UI and generated availability manifest.
name: Deploy help videos

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag holding the video assets"
        required: true
        default: "help-videos-v1"

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'help-videos-')
    runs-on: ubuntu-latest
    concurrency: deploy-help-videos
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -la assets

      - name: Validate Azerbaijani media package
        run: scripts/validate-help-video-assets.sh assets

      - name: Upload to leadshelf-1
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "root@$HOST" 'mkdir -p /opt/leadshelf/prod/help-videos/player'
          scp -i ~/.ssh/deploy_key assets/* "root@$HOST:/opt/leadshelf/prod/help-videos/player/"
          ssh -i ~/.ssh/deploy_key "root@$HOST" 'ls -la /opt/leadshelf/prod/help-videos/player'
