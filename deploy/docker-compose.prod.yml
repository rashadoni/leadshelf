# Прод-стек leadshelf-1 (/opt/leadshelf/prod). Запуск от root,
# .env.production root:600 (см. SERVER_SETUP шаг 3). Наружу — только caddy.
name: leadshelf-prod

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: runner
    env_file: .env.production
    environment:
      # Help-guide videos live OUTSIDE the image (too heavy for git/registry):
      # recorder output is rsync'ed to /opt/leadshelf/prod/help-videos/player
      # and mounted read-only below; /api/help-videos streams from this dir.
      HELP_VIDEO_ASSET_DIR: /help-videos/player
    expose:
      - "3000"
    volumes:
      - ./help-videos:/help-videos:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  migrate:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: migrate
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"] # только docker compose run --rm migrate

  seed-demo:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: seed-demo
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"] # только docker compose run --rm seed-demo

  worker-import:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: worker
    command: ["pnpm", "--filter", "@leadshelf/worker", "import:queue"]
    env_file: .env.production
    volumes:
      - workerdata:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-notifications:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: worker
    command: ["pnpm", "--filter", "@leadshelf/worker", "notifications"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-proof-analysis:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: worker
    command: ["pnpm", "--filter", "@leadshelf/worker", "proof-analysis"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # Vision HTTP boundary для photo-proof: web зовёт http://vision:4010/v1/scan
  # (VISION_SERVICE_URL в .env.production). Провайдер выбирается VISION_PROVIDER
  # (stub|openai|gemini). Наружу не публикуется. Картинки тянет по signed
  # /api/vision-media URL, поэтому нужен доступ к web/caddy на рантайме.
  vision:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: worker
    command: ["pnpm", "--filter", "@leadshelf/vision", "serve"]
    env_file: .env.production
    expose:
      - "4010"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # POSTGRES_USER/DB/PASSWORD приходят из .env.production (env_file, не
    # ${}-интерполяция — та читает окружение хоста, а не env_file!)
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadshelf"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data
    # MINIO_ROOT_USER/PASSWORD — тоже из .env.production
    env_file: .env.production
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  workerdata:
  caddy_data:
  caddy_config:
