# Прод-стек leadshelf-1 (/opt/leadshelf/prod). Запуск от root,
# .env.production root:600 (см. SERVER_SETUP шаг 3). Наружу — только caddy.
name: leadshelf-prod

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: runner
    env_file: .env.production
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  migrate:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: migrate
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"] # только docker compose run --rm migrate

  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadshelf}
      POSTGRES_DB: ${POSTGRES_DB:-leadshelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadshelf"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data
    env_file: .env.production
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
