# Прод-стек leadshelf-1 (/opt/leadshelf/prod). Запуск от root,
# .env.production root:600 (см. SERVER_SETUP шаг 3). Наружу — только caddy.
name: leadshelf-prod

services:
  caddy:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: runner
    env_file: .env.production
    environment:
      # Client production must never enable demo DB probes or synthetic media.
      LEADSHELF_RUNTIME_PROFILE: client
      # Reviewed help-guide assets are copied from the approved git release to
      # /opt/leadshelf/prod/help-videos/player and mounted read-only below.
      HELP_VIDEO_ASSET_DIR: /help-videos/player
    expose:
      - "3000"
    volumes:
      - ./help-videos:/help-videos:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: migrate
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"] # только docker compose run --rm migrate

  seed-demo:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: seed-demo
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"] # только docker compose run --rm seed-demo

  worker-import:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: worker
    command: ["node", "services/worker/node_modules/tsx/dist/cli.mjs", "services/worker/src/import-queue-runner.ts"]
    env_file: .env.production
    volumes:
      - workerdata:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &worker-healthcheck
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  worker-notifications:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: worker
    command: ["node", "services/worker/node_modules/tsx/dist/cli.mjs", "services/worker/src/notification-delivery-runner.ts"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  worker-proof-analysis:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: worker
    command: ["node", "services/worker/node_modules/tsx/dist/cli.mjs", "services/worker/src/proof-analysis-runner.ts"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  # Vision HTTP boundary для photo-proof: web зовёт http://vision:4010/v1/scan
  # (VISION_SERVICE_URL в .env.production). Провайдер выбирается VISION_PROVIDER
  # (stub|openai|gemini). Наружу не публикуется. Картинки тянет по signed
  # /api/vision-media URL, поэтому нужен доступ к web/caddy на рантайме.
  vision:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.web
      target: worker
    command: ["node", "services/vision/node_modules/tsx/dist/cli.mjs", "services/vision/src/server.ts"]
    env_file: .env.production
    expose:
      - "4010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.postgres
    # POSTGRES_USER/DB/PASSWORD приходят из .env.production (env_file, не
    # ${}-интерполяция — та читает окружение хоста, а не env_file!)
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadshelf"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  workerdata:
  caddy_data:
  caddy_config:
