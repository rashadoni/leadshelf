plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.leadshelf.mobile'
version = '1.0.0'

android {
  namespace "expo.modules.workforceattendancetrust"
  defaultConfig {
    // Expo autolinking derives the local Maven artifact version from this value.
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.biometric:biometric:1.1.0"
}
